name: DevSecOps Enterprise Pipeline

# Luồng sẽ tự động chạy mỗi khi có code mới đẩy lên nhánh master
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # ==========================================
  # CHỐT CHẶN 1: SAST (Quét mã nguồn tĩnh)
  # ==========================================
  sast-semgrep:
    name: Code Security (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Chạy Semgrep rà quét Injection, XSS, Hardcoded Secrets
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
          generateSarif: "1"
          # Cấu hình Fail-build nếu phát hiện lỗi High/Critical
          auditOn: push

  # ==========================================
  # CHỐT CHẶN 2: SCA (Quét thư viện & Container)
  # ==========================================
  sca-trivy:
    name: Container Security (Trivy)
    needs: sast-semgrep # Chỉ chạy khi SAST đã pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image cho ứng dụng
        run: docker build -t nodegoat-app:latest .

      - name: Quét lỗ hổng CVE với Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nodegoat-app:latest'
          format: 'table'
          exit-code: '1' # Đánh sập luồng (Fail-build) nếu có lỗi
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # CHỐT CHẶN 3: DAST (Kiểm thử động)
  # ==========================================
  dast-zap:
    name: Dynamic Testing (OWASP ZAP)
    needs: sca-trivy # Chỉ chạy khi SCA đã pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dựng ứng dụng lên (Staging Environment ảo)
        run: |
          docker build -t nodegoat-app:latest .
          docker run -d -p 4000:4000 --name running-app nodegoat-app:latest
          # Đợi ứng dụng khởi động hoàn tất
          sleep 15 

      - name: Chạy OWASP ZAP Baseline Scan nhắm vào ứng dụng
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:4000'
          # Xuất báo cáo dạng HTML
          report_html: true
          fail_action: false # Không fail-build ở bước này để lấy report

      - name: Lưu trữ Báo cáo DAST
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-Report
          path: zap_report.html